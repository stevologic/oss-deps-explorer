name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: oss-deps-explorer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Lint
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path '*/vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...

      - name: Test
        run: go test ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - name: UI tests
        run: node --test "ui/**/*.test.mjs"

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

  publish:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build validated production image
        if: env.REGISTRY != ''
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Login to registry
        if: env.REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        if: env.REGISTRY != ''
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} ${{ env.REGISTRY }}/$IMAGE_NAME:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/$IMAGE_NAME:${{ github.sha }}
