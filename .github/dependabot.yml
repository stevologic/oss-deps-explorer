# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repository is a Go module plus a vendored static UI. There is no
# package.json or lockfile at / (or anywhere else). Do not add an npm /
# npm_and_yarn ecosystem here — Dependabot will fail with
# dependency_file_not_found for /package.json.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: development # version updates only
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: development # version updates only
    schedule:
      interval: "monthly"


  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
        update-types: ['version-update:semver-major']
      - dependency-name: alpine
        update-types: ['version-update:semver-major']
